<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Anthropic / Claude Editorial Warm Paper Palette */
      --bg:             #FBF9F5;
      --bg-alt:         #F3EFE6;
      --bg-hover:       #EAE4D8;
      --text-primary:   #2C2A29;
      --text-secondary: #5E5B56;
      --text-muted:     #8C8882;
      --border:         #E3DEC3;
      --border-subtle:  #EBE6DC;
      --accent:         #B95525; /* Warm Terracotta / Clay */
      
      --font-serif: 'Noto Serif SC', Georgia, serif;
      --font-sans:  'Noto Sans SC', system-ui, -apple-system, sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: #EAD5C5; color: var(--text-primary); }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-serif);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.85;
      font-size: 17.5px;
      letter-spacing: -0.003em;
    }

    /* Hero */
    .hero {
      max-width: 740px;
      margin: 0 auto;
      padding: 6rem 2rem 3.5rem;
      text-align: center;
      border-bottom: 1px dashed var(--border);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 2.85rem);
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      letter-spacing: -0.015em;
    }

    /* Anthropic Warm Paper Source Card */
    .source-card {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-top: 1.75rem;
      text-align: left;
      align-items: center;
    }

    .source-thumb {
      width: 120px;
      height: 75px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .source-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .source-details {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
    }

    .meta-item {
      display: inline-flex;
      gap: 6px;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-val {
      color: var(--text-primary);
      font-weight: 500;
    }

    .video-info-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 4px;
      align-self: flex-start;
      transition: all 0.2s ease;
    }

    .video-info-badge:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }

    /* Container */
    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 3.5rem 2rem 7rem;
    }

    /* Editorial Prose Typography */
    .container p {
      font-size: 1.08rem;
      line-height: 1.95;
      color: var(--text-primary);
      margin-bottom: 1.6rem;
    }
    
    /* Drop Cap for first paragraph */
    .container > p:first-of-type::first-letter {
      font-family: var(--font-serif);
      font-size: 3.6rem;
      float: left;
      line-height: 0.82;
      margin-right: 0.6rem;
      margin-top: 0.15rem;
      color: var(--accent);
      font-weight: 700;
    }

    .container h2 {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 700;
      margin: 3.75rem 0 1.35rem;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .container h3 {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      color: var(--text-primary);
    }

    .container ul, .container ol {
      margin-bottom: 1.6rem;
      padding-left: 1.75rem;
    }

    .container li {
      margin-bottom: 0.6rem;
      line-height: 1.85;
    }

    .container strong {
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Blockquote */
    .container blockquote {
      margin: 2.5rem 0;
      padding: 1.4rem 1.75rem;
      background: var(--bg-alt);
      border-left: 3px solid var(--accent);
      color: var(--text-secondary);
      font-style: normal;
      border-radius: 0 6px 6px 0;
    }
    
    .container blockquote p {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text-primary);
    }

    /* Callouts / Highlights */
    .callout {
      margin: 2rem 0;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      background: var(--bg-alt);
      border-radius: 6px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .callout-icon {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .callout-content p {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 0.96rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    /* Code Snippets */
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--bg-alt);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--border-subtle);
    }

    pre {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.75rem 0;
    }

    pre code {
      border: none;
      background: none;
      padding: 0;
    /* Multimodal Article Figures */
    .article-figure {
      margin: 2.25rem 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-alt);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .article-figure img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .article-figure figcaption {
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg);
      line-height: 1.5;
    }
    .fig-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(217, 119, 87, 0.12);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Footer */
    footer {
      max-width: 740px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      text-align: center;
      border-top: 1px dashed var(--border);
    }

    footer p {
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 4rem 1.25rem 2.5rem;
      }
      .hero h1 {
        font-size: 1.95rem;
      }
      .container {
        padding: 2.25rem 1.25rem 5rem;
      }
      .container > p:first-of-type::first-letter {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>{{ title }}</h1>

    <!-- Anthropic Editorial Source Card -->
    <div class="source-card">
      {% if thumbnail_url and thumbnail_url != "" %}
      <div class="source-thumb">
        <img src="{{ thumbnail_url }}" alt="{{ title }}" loading="lazy" />
      </div>
      {% endif %}
      <div class="source-details">
        <div class="source-header">
          <span class="hero-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            {{ platform }} 原创内容出处
          </span>
        </div>
        <div class="source-meta">
          <div class="meta-item">
            <span class="meta-label">原作者</span>
            <span class="meta-val">{{ author }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">发布时间</span>
            <span class="meta-val">{{ publish_date }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">视频时长</span>
            <span class="meta-val">{{ duration_formatted }}</span>
          </div>
        </div>
        <a href="{{ video_url }}" target="_blank" class="video-info-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          原视频链接
        </a>
      </div>
    </div>
  </header>

  <article class="container">
    {{ article_content }}
  </article>

  <footer>
    <p>🍃 声明：本文基于视频字幕经 Anthropic Editorial 风格自动整理渲染，仅供学术与研究探讨使用。</p>
  </footer>
</body>
</html>
