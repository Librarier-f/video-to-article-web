<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Swiss Architectural Minimalist System */
      --ink:        #111111;
      --ink-light:  #444444;
      --ink-muted:  #888888;
      --paper:      #ffffff;
      --paper-alt:  #f5f5f7;
      --border:     #e5e5eb;
      --accent:     #111111;
      
      --font-sans: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: #111111; color: #ffffff; }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.8;
      letter-spacing: -0.005em;
    }

    /* Hero Section */
    .hero {
      padding: 6.5rem 2rem 4rem;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .overline {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
      display: inline-block;
      font-weight: 500;
    }

    .hero h1 {
      font-family: var(--font-sans);
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
      margin-bottom: 1.5rem;
      letter-spacing: -0.025em;
    }

    /* Swiss Style Source Card */
    .source-card {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--paper-alt);
      border: 1px solid var(--border);
      border-left: 3px solid var(--ink);
      padding: 1.25rem 1.5rem;
      margin-top: 1.75rem;
      text-align: left;
      align-items: center;
    }

    .source-thumb {
      width: 120px;
      height: 75px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--paper);
      border: 1px solid var(--border);
    }

    .source-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .source-details {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--ink);
      font-size: 13px;
    }

    .meta-item {
      display: inline-flex;
      gap: 4px;
    }

    .meta-label {
      color: var(--ink-muted);
    }

    .meta-val {
      color: var(--ink);
      font-weight: 500;
    }

    .video-info-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--paper);
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 600;
      align-self: flex-start;
      transition: all 0.2s ease;
    }

    .video-info-badge:hover {
      background: var(--ink);
      color: var(--paper);
      transform: translateY(-1px);
    }

    /* Article Container */
    article {
      max-width: 740px;
      margin: 0 auto;
      padding: 4rem 2rem 8rem;
    }

    /* Prose elements */
    article p {
      font-size: 1.06rem;
      line-height: 1.85;
      color: var(--ink);
      margin-bottom: 1.6rem;
    }

    article h2 {
      font-family: var(--font-sans);
      font-size: 1.55rem;
      font-weight: 700;
      margin: 3.75rem 0 1.35rem;
      color: var(--ink);
      letter-spacing: -0.02em;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    article h3 {
      font-family: var(--font-sans);
      font-size: 1.25rem;
      font-weight: 600;
      margin: 2.25rem 0 0.85rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    article ul, article ol {
      margin-bottom: 1.6rem;
      padding-left: 1.75rem;
      color: var(--ink);
    }

    article li {
      margin-bottom: 0.55rem;
      line-height: 1.8;
    }

    article strong {
      font-weight: 700;
      color: var(--ink);
    }

    /* Blockquote */
    article blockquote {
      margin: 2.5rem 0;
      padding: 1.25rem 1.75rem;
      background: var(--paper-alt);
      border-left: 3px solid var(--ink);
      color: var(--ink);
      font-size: 1.05rem;
    }

    article blockquote p {
      margin: 0;
    }

    /* Callouts */
    .callout {
      margin: 2rem 0;
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      background: var(--paper-alt);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .callout-icon {
      font-size: 1.25rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .callout-content p {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--ink-light);
    }

    /* Code blocks */
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--paper-alt);
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid var(--border);
    }

    pre {
      background: var(--paper-alt);
      border: 1px solid var(--border);
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.75rem 0;
    }

    pre code {
      border: none;
      padding: 0;
      background: none;
    /* Multimodal Article Figures */
    .article-figure {
      margin: 2.25rem 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--paper-alt);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }
    .article-figure img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .article-figure figcaption {
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: var(--paper);
      line-height: 1.5;
    }
    .fig-badge {
      display: inline-flex;
      align-items: center;
      background: var(--paper-alt);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Footer */
    footer {
      padding: 3rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
      background: var(--paper-alt);
    }

    footer p {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-muted);
      margin: 0;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 4rem 1.25rem 3rem;
      }
      article {
        padding: 2.25rem 1.25rem 6rem;
      }
      .hero h1 {
        font-size: 1.95rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>{{ title }}</h1>

    <!-- Swiss Architectural Source Card -->
    <div class="source-card">
      {% if thumbnail_url and thumbnail_url != "" %}
      <div class="source-thumb">
        <img src="{{ thumbnail_url }}" alt="{{ title }}" loading="lazy" />
      </div>
      {% endif %}
      <div class="source-details">
        <div class="source-header">
          <span class="overline">{{ platform }} // ARCHIVE</span>
        </div>
        <div class="source-meta">
          <div class="meta-item">
            <span class="meta-label">原作者：</span>
            <span class="meta-val">{{ author }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">发布日期：</span>
            <span class="meta-val">{{ publish_date }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">时长：</span>
            <span class="meta-val">{{ duration_formatted }}</span>
          </div>
        </div>
        <a href="{{ video_url }}" target="_blank" class="video-info-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Watch Original Source
        </a>
      </div>
    </div>
  </header>

  <article>
    {{ article_content }}
  </article>

  <footer>
    <p>SWISS EDITORIAL SYSTEM // RESPECT COPYRIGHT</p>
  </footer>
</body>
</html>
