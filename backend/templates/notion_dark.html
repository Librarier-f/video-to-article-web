<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Refined Notion Dark Theme */
      --bg-base:        #191919;
      --bg-surface:     #222222;
      --bg-hover:       #2c2c2c;
      --border:         #2f2f2f;
      --border-subtle:  #262626;

      --text-primary:   #ededed;
      --text-secondary: #a1a1a1;
      --text-muted:     #737373;

      /* Notion Callout Tints */
      --callout-blue-bg:     #1d283a;
      --callout-blue-border: #2b3d5b;
      --callout-blue-text:   #8db5e9;

      --callout-green-bg:    #1b2d23;
      --callout-green-border:#274334;
      --callout-green-text:  #9ed5ad;

      --callout-orange-bg:   #34241a;
      --callout-orange-border:#4d3627;
      --callout-orange-text: #e8a87c;

      --callout-yellow-bg:   #332b17;
      --callout-yellow-border:#4c4021;
      --callout-yellow-text: #e6d385;

      --callout-pink-bg:     #331d27;
      --callout-pink-border: #4a2a39;
      --callout-pink-text:   #e89bb9;

      --font-sans: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background: rgba(45, 170, 219, 0.25);
      color: #ffffff;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.75;
      font-size: 16px;
      letter-spacing: -0.005em;
    }

    .page {
      max-width: 740px;
      margin: 0 auto;
      padding: 5rem 2rem 8rem;
    }

    /* Source Credit Card */
    .source-card {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 3.5rem;
      align-items: center;
    }

    .source-thumb {
      width: 120px;
      height: 75px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-base);
    }

    .source-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .source-details {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .source-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .meta-item {
      display: inline-flex;
      gap: 6px;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-val {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Action Links */
    .video-source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      align-self: flex-start;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .video-source-link:hover {
      background: #333333;
      border-color: #4a4a4a;
    }

    /* Article Content Typograhy */
    h2 {
      font-size: 1.55rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
      margin-top: 3rem;
      margin-bottom: 1.25rem;
      letter-spacing: -0.015em;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
      margin-top: 2.25rem;
      margin-bottom: 0.85rem;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 1.05rem;
      color: var(--text-primary);
      margin-bottom: 1.4rem;
      line-height: 1.8;
    }

    strong {
      color: #ffffff;
      font-weight: 600;
    }

    a {
      color: var(--text-primary);
      text-decoration: underline;
      text-decoration-color: var(--text-muted);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s ease;
    }

    a:hover {
      text-decoration-color: var(--text-primary);
    }

    blockquote {
      border-left: 3px solid #ededed;
      margin: 2rem 0;
      padding: 0.6rem 1.25rem;
      color: var(--text-secondary);
      font-size: 1.05rem;
      background: var(--bg-surface);
      border-radius: 0 4px 4px 0;
    }

    blockquote p {
      margin: 0;
      color: var(--text-secondary);
    }

    ul, ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.55rem;
      line-height: 1.75;
      color: var(--text-primary);
    }

    /* Notion Callouts */
    .callout {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      padding: 1.1rem 1.35rem;
      margin: 1.75rem 0;
    }

    .callout-blue { background: var(--callout-blue-bg); border-color: var(--callout-blue-border); }
    .callout-green { background: var(--callout-green-bg); border-color: var(--callout-green-border); }
    .callout-orange { background: var(--callout-orange-bg); border-color: var(--callout-orange-border); }
    .callout-yellow { background: var(--callout-yellow-bg); border-color: var(--callout-yellow-border); }
    .callout-pink { background: var(--callout-pink-bg); border-color: var(--callout-pink-border); }

    .callout-icon {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .callout-content p {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-primary);
    }

    /* Code Blocks */
    pre, code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }

    code {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      color: #e2a478;
    }

    pre {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }

    /* Footer */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4.5rem 0 2rem;
    }

    footer {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .page {
        padding: 3rem 1.25rem 6rem;
      }
      h1 {
        font-size: 1.85rem;
      }
      h2 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>{{ title }}</h1>

    <!-- Source Credit Card -->
    <div class="source-card">
      {% if thumbnail_url and thumbnail_url != "" %}
      <div class="source-thumb">
        <img src="{{ thumbnail_url }}" alt="{{ title }}" loading="lazy" />
      </div>
      {% endif %}
      <div class="source-details">
        <div class="source-tag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          {{ platform }} 原创内容出处
        </div>
        <div class="source-meta">
          <div class="meta-item">
            <span class="meta-label">原作者</span>
            <span class="meta-val">{{ author }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">发布时间</span>
            <span class="meta-val">{{ publish_date }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">视频时长</span>
            <span class="meta-val">{{ duration_formatted }}</span>
          </div>
        </div>
        <a class="video-source-link" href="{{ video_url }}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          观看原视频
        </a>
      </div>
    </div>

    <!-- Main Article Content -->
    {{ article_content }}

    <hr class="divider">

    <footer>
      <p>💡 提示：本文内容系根据视频字幕自动提取整理，格式遵循 Notion 暗黑规范排版。仅供学习交流使用。</p>
    </footer>
  </div>
</body>
</html>
