<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Industrial Terminal / Brutalist Cyber Aesthetics */
      --bg:             #0a0a0c;
      --bg-alt:         #121216;
      --bg-card:        #18181f;
      --fg:             #e2e8f0;
      --fg-muted:       #718096;
      --border:         #2d3748;
      --border-accent:  #4a5568;
      
      --accent-orange:  #ff5500; /* Industrial Neon Orange */
      --accent-cyan:    #00f0ff; /* Terminal Neon Cyan */
      
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Noto Sans SC', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: var(--accent-orange); color: #000000; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.75;
      font-size: 16px;
    }

    /* Subtle Faint Grid Line Background overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Hero */
    .hero {
      position: relative;
      z-index: 1;
      padding: 5.5rem 2rem 3.5rem;
      max-width: 800px;
      margin: 0 auto;
      border-bottom: 2px solid var(--border);
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #000000;
      background: var(--accent-cyan);
      text-transform: uppercase;
      padding: 4px 10px;
      margin-bottom: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .hero h1 {
      font-family: var(--font-mono);
      font-size: clamp(2.1rem, 4vw, 2.75rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    /* Industrial Brutalist Terminal Source Card */
    .source-card {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-left: 4px solid var(--accent-cyan);
      padding: 1.25rem 1.5rem;
      margin-top: 1.75rem;
      text-align: left;
      align-items: center;
    }

    .source-thumb {
      width: 120px;
      height: 75px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .source-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .source-details {
      flex: 1;
      min-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12.5px;
    }

    .meta-item {
      display: inline-flex;
      gap: 6px;
    }

    .meta-label {
      color: var(--fg-muted);
    }

    .meta-val {
      color: var(--fg);
      font-weight: 600;
    }

    .video-info-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--bg);
      border: 1px solid var(--accent-orange);
      color: var(--accent-orange);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      align-self: flex-start;
      transition: all 0.15s ease;
    }

    .video-info-badge:hover {
      background: var(--accent-orange);
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 85, 0, 0.35);
    }

    /* Container */
    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 3.5rem 2rem 8rem;
    }

    /* Typography */
    .container p {
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--fg);
      margin-bottom: 1.5rem;
    }

    .container h2 {
      font-family: var(--font-mono);
      font-size: 1.45rem;
      font-weight: 700;
      margin: 3.5rem 0 1.25rem;
      color: #ffffff;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    
    .container h2::before {
      content: '// ';
      color: var(--accent-orange);
    }

    .container h3 {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 700;
      margin: 2.25rem 0 0.85rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    .container ul, .container ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    .container li {
      margin-bottom: 0.55rem;
      line-height: 1.75;
    }

    .container strong {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    /* Blockquote */
    .container blockquote {
      margin: 2rem 0;
      padding: 1.25rem 1.5rem;
      background: var(--bg-card);
      border-left: 4px solid var(--accent-orange);
      color: var(--fg);
      font-size: 1.05rem;
    }
    
    .container blockquote p {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.98rem;
    }

    /* Callouts */
    .callout {
      margin: 2rem 0;
      padding: 1.25rem;
      border: 1px solid var(--border-accent);
      background: var(--bg-card);
      display: flex;
      gap: 14px;
    }

    .callout-icon {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      color: var(--accent-cyan);
      line-height: 1;
    }

    .callout-content p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* Code & Terminal blocks */
    code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: var(--accent-cyan);
      background: var(--bg-card);
      padding: 2px 6px;
      border: 1px solid var(--border);
    }

    pre {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    pre code {
      border: none;
      padding: 0;
      background: none;
      color: inherit;
    /* Multimodal Article Figures */
    .article-figure {
      margin: 2.25rem 0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg-card);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .article-figure img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }
    .article-figure figcaption {
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      font-family: var(--font-mono);
      line-height: 1.5;
    }
    .fig-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    hr {
      border: 0;
      border-top: 1px dashed var(--border);
      margin: 4rem 0;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      padding: 2.5rem 2rem;
      text-align: left;
      border-top: 2px solid var(--border);
      background: var(--bg);
      max-width: 800px;
      margin: 0 auto;
    }

    footer p {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 3.5rem 1.25rem 2.5rem;
      }
      .hero h1 {
        font-size: 1.85rem;
      }
      .container {
        padding: 2.25rem 1.25rem 6rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>{{ title }}</h1>

    <!-- Brutalist Terminal Source Card -->
    <div class="source-card">
      {% if thumbnail_url and thumbnail_url != "" %}
      <div class="source-thumb">
        <img src="{{ thumbnail_url }}" alt="{{ title }}" loading="lazy" />
      </div>
      {% endif %}
      <div class="source-details">
        <div class="source-header">
          <span class="hero-tag">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            {{ platform }} // SRC_REF
          </span>
        </div>
        <div class="source-meta">
          <div class="meta-item">
            <span class="meta-label">AUTH:</span>
            <span class="meta-val">{{ author }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">PUB:</span>
            <span class="meta-val">{{ publish_date }}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">DUR:</span>
            <span class="meta-val">{{ duration_formatted }}</span>
          </div>
        </div>
        <a href="{{ video_url }}" target="_blank" class="video-info-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          FETCH_SOURCE_VIDEO
        </a>
      </div>
    </div>
  </header>

  <article class="container">
    {{ article_content }}
  </article>

  <footer>
    <p>[SYS_TERMINAL_LOG]: ARTICLE_EXTRACTED_SUCCESSFULLY. RESPECT_ORIGINAL_CREATOR_RIGHTS.</p>
  </footer>
</body>
</html>
