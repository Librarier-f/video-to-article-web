<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0369A1;
      --primary-light: #0EA5E9;
      --primary-dark: #0C4A6E;
      --accent: #22C55E;
      --accent-gold: #FCD34D;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --surface-alt: #F1F5F9;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: var(--primary); color: white; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.9;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f8fafc 100%);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(14, 165, 233, 0.1) 0%, transparent 60%);
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .hero-tag {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 0.4rem 1.2rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1.25;
      max-width: 16ch;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .hero h1 .highlight {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2.5rem;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    .hero-meta {
      display: flex;
      gap: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      position: relative;
      z-index: 1;
    }

    .hero-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .scroll-hint {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
    }

    .scroll-hint svg { animation: bounce 2s ease infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* Container */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* Intro */
    .intro {
      padding: 6rem 0 4rem;
    }

    .intro p {
      font-size: 1.1rem;
      line-height: 2;
      color: var(--text-secondary);
      text-align: justify;
    }

    .intro p:first-of-type::first-letter {
      font-family: 'Noto Serif SC', serif;
      font-size: 3.5rem;
      float: left;
      line-height: 1;
      margin-right: 0.5rem;
      margin-top: 0.1rem;
      color: var(--primary);
      font-weight: 700;
    }

    /* Quote */
    .quote-block {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      border-left: 4px solid var(--primary);
      padding: 2.5rem 2rem;
      margin: 3rem 0;
      border-radius: 0 12px 12px 0;
    }

    .quote-block blockquote {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.3rem;
      font-weight: 500;
      line-height: 1.7;
      color: var(--text-primary);
    }

    .quote-block cite {
      display: block;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: normal;
    }

    /* Section */
    .section { padding: 4rem 0; }

    .section-header {
      margin-bottom: 2.5rem;
      position: relative;
      padding-bottom: 1rem;
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--primary);
      margin-bottom: 0.75rem;
      display: block;
      font-weight: 600;
      text-transform: uppercase;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 2px;
    }

    /* Method Card */
    .method {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin: 2rem 0;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .method:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(3, 105, 161, 0.12);
    }

    .method-number {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-family: 'Noto Serif SC', serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--primary);
      opacity: 0.1;
      line-height: 1;
    }

    .method-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .method-icon svg { width: 24px; height: 24px; stroke: white; fill: none; }

    .method h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }

    .method p {
      color: var(--text-secondary);
      line-height: 1.85;
      font-size: 0.95rem;
    }

    .highlight-box {
      background: var(--surface-alt);
      border-left: 3px solid var(--primary);
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
    }

    .highlight-box p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-primary);
    }

    /* Summary */
    .summary {
      padding: 5rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }

    .summary h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .summary p {
      max-width: 480px;
      margin: 0 auto 2rem;
      opacity: 0.9;
      line-height: 1.8;
    }

    .takeaway {
      display: inline-block;
      background: white;
      color: var(--primary);
      padding: 1rem 2.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 30px;
      letter-spacing: 0.05em;
    }

    /* Footer */
    .footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .method { padding: 1.5rem; }
      .method-number { font-size: 2.5rem; }
      .hero-meta { flex-direction: column; gap: 0.5rem; }
    }
    
    /* Layout enhancements */
    .video-info-badge {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      color: inherit;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
      z-index: 10;
      position: relative;
    }
    .video-info-badge:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }
    
    /* Ensure reveal anim compatibility */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header class="hero">
    <span class="hero-tag">{{ platform }}</span>
    <h1>{{ title }}</h1>
    <p class="hero-subtitle">由 {{ author }} 发布于 {{ publish_date }} | 时长 {{ duration_formatted }}</p>
    
    <a href="{{ video_url }}" target="_blank" class="video-info-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      观看原视频
    </a>
  </header>

  <article class="container" style="padding-bottom: 8rem;">
    <div style="padding-top: 4rem;">
      {{ article_content }}
    </div>
  </article>

  <footer style="padding: 3rem 0; text-align: center; border-top: 1px solid var(--border, rgba(255,255,255,0.1)); opacity: 0.8; font-size: 0.8rem;">
    <p>⚠️ 重要提示：本文内容基于视频字幕整理，仅供个人学习研究使用。发布前请注意标注视频来源以尊重原作者版权。</p>
  </footer>

  <script>
    const revealElements = document.querySelectorAll('.reveal');
    const revealOnScroll = () => {
      const windowHeight = window.innerHeight;
      revealElements.forEach(el => {
        const elementTop = el.getBoundingClientRect().top;
        if (elementTop < windowHeight - 100) {
          el.classList.add('visible');
        }
      });
    };
    window.addEventListener('scroll', revealOnScroll);
    window.addEventListener('load', revealOnScroll);
  </script>
</body>
</html>
